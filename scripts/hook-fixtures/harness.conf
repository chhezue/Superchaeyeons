# test-hooks.sh 케이스의 기본 프로젝트 설정 — 케이스마다 임시 프로젝트의 .claude/harness.conf로 복사된다.
# 값은 이 저장소의 훅 판정과 같게 둔다(범위 저장소 전체 · 자기 수정 허용 · 폴더 통째 삭제는 맡기기). 케이스가 키를 바꿔 다른 값을 시험한다.
SCOPE=.
HARNESS_SELF_EDIT=1
TEST_CMD=scripts/dev.sh test
BLOCK_FORCE_PUSH=1
BLOCK_BULK_DELETE=0
BLOCK_GIT_DISCARD=1
BLOCK_CHECK_BYPASS=1
BLOCK_DATA_DELETE=1
BLOCK_SYSTEM=1
AUTO_ANALYZE=1
