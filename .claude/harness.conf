# 이 프로젝트의 하네스 값 — 키 목록과 뜻은 플러그인 scripts/harness-keys.txt, 값 규칙은 skills/init-harness/references/harness-conf.md.
# 훅·세션 시작 주입·init-harness가 읽는다. 값이 {…} 한 쌍이면 빈칸이고, 해당 없으면 `(없음) — 이유`로 적는다.

AXES=lang 없음(md·sh — 훅·검사기는 bash·python3 전제) · shape 단일 저장소(작업 범위 전체, .github/ 쓰기 가능) · deploy 없음 · stage 초기(운영 데이터 없음)

# 경로 슬롯 — {{문서 루트}} 기준
DOC_ROOT=docs
SCOPE=.
GIT_CONVENTION=.github/CONTRIBUTING.md
SPEC_DIR=docs/specs/
CURRENT_BEHAVIOR=docs/harness/README.md — 이 저장소의 "보안·아키텍처 성격 변경"은 훅·규칙 동작 변경이다
PRIORITY_SSOT=(없음) — 이슈 우선순위 라벨 체계가 없다. 작업 순서는 스펙의 단계(Phase) 표
ARCH_OVERVIEW=docs/harness/README.md
SCHEMA_SSOT=(없음) — DB 없음
API_RESPONSE=(없음) — API 없음
API_DOCS=(없음) — API 없음
PRODUCT_SCOPE=AGENTS.md
CLIENT_ASSUMPTIONS=(없음) — 클라이언트 없음
GLOSSARY=(없음) — 하네스 용어(축·슬롯·플래그·트랙·규모·게이트)는 플러그인 scripts/harness-keys.txt와 core-workflow.md가 정의
DECISIONS_DIR=docs/decisions/
AUDIT_DIR=docs/audits/
DEPLOY_SSOT=(없음) — 배포 없음

# 명령·형식 슬롯 — 테스트·빌드·포맷·의존성 조회는 플러그인 scripts/dev.sh <동사>이고, 실제 명령은 루트 dev.conf가 갖는다
TEST_CMD=scripts/dev.sh test
BUILD_CMD=(없음) — 빌드 없음
FORMAT_CMD=(없음) — 포맷 도구 없음
DEPS_CMD=(없음) — 의존성 없음
BRANCH_FORMAT={type}/{issue-number}-{description}
COMMIT_FORMAT={Type}: {한글}
BASE_BRANCH=main
MERGE_METHOD=rebase merge(gh pr merge --rebase --delete-branch) — 2026-10-27부터, 이전 이력은 merge commit
ISSUE_LINK=GitHub Issues · 안내 local-track-issues

# 능력 플래그 — 1 적용 · 0 무시
FLAG_GENERATED_DOCS=0
HARNESS_SELF_EDIT=1
POLISH_ENABLED=1

# 훅이 판정에 쓰는 값
COMMIT_RE=
FORMAT_PATHS=
CONTRACT_PATHS=
DEPS_FILES=
DEPS_ADD_CMD=
ASK_PATHS=
ASK_COMMIT=1
ASK_DELETE=1
ASK_DEPS=1
ASK_SENSITIVE=1
ASK_SPEC=1
BLOCK_FORCE_PUSH=1
BLOCK_BULK_DELETE=0
BLOCK_GIT_DISCARD=1
BLOCK_CHECK_BYPASS=1
BLOCK_DATA_DELETE=1
BLOCK_SYSTEM=1
AUTO_ANALYZE=1
