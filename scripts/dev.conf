# scripts/dev.sh가 읽는 이 프로젝트의 값 — 배달본은 빈칸이다. 키 목록과 뜻은 scripts/dev.sh 머리가 SSOT다.
# init-harness 3단계가 씨앗 dev.conf(없으면 1단계 실측: CI 워크플로의 실제 명령·compose 서비스·설정 파일의 포트와 헬스 주소)로 채운다.
# {…}가 남아 있으면 dev.sh가 exit 2로 멈춘다. 해당 없는 키는 `없음 — <이유>`로 적는다.

BUILD_CMD={빌드 명령}
TEST_CMD={전체 테스트 명령 — 인자 없이 전체를 돈다}
TEST_REPORT={junit:<결과 파일 경로 패턴> 또는 last-line}
FMT_CMD={포맷 명령}
DEPS_CMD={의존성 조회 명령}

RUN_ENV={모든 명령에 넘길 K=V — 비밀값 금지}

SERVICES={앱보다 먼저 띄울 compose 서비스 이름}
EXTRA_CONTAINERS={compose에 없는 의존 서비스 이름,이미지,포트}
WAIT_SERVICES={서비스 준비를 기다릴 최대 초}

START_CMD={앱 기동 명령 — 포그라운드로 돌고, 백그라운드 데몬을 띄우지 않는 형태}
APP_PORT={앱 포트}
HEALTH_URL={2xx면 기동 성공으로 볼 주소}
WAIT_HEALTH={헬스 성공을 기다릴 최대 초}

LOG_DIR={전체 로그를 둘 폴더 — 버전 관리에서 빠진 곳}
