# scripts/dev.sh가 읽는 값 — Java · Spring Boot · Gradle 씨앗. 키 목록과 뜻은 scripts/dev.sh 머리가 SSOT다.
# 원본 백엔드 프로젝트(2026-10-24)에서 test·build·start·stop을 실제로 돌려 확인한 값이다. 복사한 뒤 README "씨앗 대조" 표대로 맞춘다.

# Gradle 데몬을 쓰지 않는다(--no-daemon) — 데몬이 앱을 띄우면 앱이 dev.sh의 프로세스 그룹 밖에 남아 stop으로 꺼지지 않는다
# test는 --rerun — 입력이 그대로면 Gradle이 테스트를 건너뛰고(UP-TO-DATE) 결과 파일을 새로 쓰지 않아 dev.sh가 실패로 본다
BUILD_CMD=./gradlew build -x test --no-daemon
TEST_CMD=./gradlew test --no-daemon --rerun
TEST_REPORT=junit:build/test-results/test/*.xml
FMT_CMD=./gradlew spotlessApply --no-daemon
DEPS_CMD=./gradlew dependencies --configuration runtimeClasspath --no-daemon

# DB 접속 정보는 .env에서 읽힌다(docker compose와 bootRun 둘 다). 비밀값을 여기에 적지 않는다
RUN_ENV=없음 — 값은 .env

# compose에 있는 서비스는 SERVICES, compose에 없지만 로컬에 필요한 서비스는 EXTRA_CONTAINERS(이름,이미지,포트)
SERVICES=mysql
EXTRA_CONTAINERS=redis,redis:7-alpine,6379
WAIT_SERVICES=60

# 전체 헬스(/actuator/health)로 판정한다 — readiness만 보면 Redis 없이도 성공으로 나와 나중에 헬스 DOWN을 다시 쫓게 된다
START_CMD=./gradlew bootRun --no-daemon
APP_PORT=8080
HEALTH_URL=http://localhost:8080/actuator/health
WAIT_HEALTH=120

# Gradle 빌드 폴더 — 이미 버전 관리에서 빠져 있고 clean으로 같이 지워진다
LOG_DIR=build/dev
