# 이 저장소의 하네스 값 — 하네스 원본이라 배달되지 않는 저장소 루트에 둔다(dev.conf와 같은 이유).
# 붙일 때 복사하는 것은 .claude/·scripts/·docs/templates/뿐이라, 여기 적은 값은 새 프로젝트로 따라가지 않는다.
# 형식은 `키=값` 한 줄씩. 플러그인 배달로 옮기면 .claude/harness.conf가 된다(harness-plugin-delivery 스펙).
#
# POLISH_ENABLED — harness-map.md "Gemini 다듬기" ☑. scripts/polish-with-gemini.sh의 기본값(0)보다 앞선다
POLISH_ENABLED=1
