# auto-inject-config.sh 정상 케이스용 견본 — harness-keys.txt의 slot·flag 키를 모두 채웠다(빈칸 없음).
# 일부 값은 "해당 없음" 표기((없음) — 이유)와 여러 중괄호 값이다 — 둘 다 빈칸이 아니다.
AXES=lang=java shape=server deploy=container stage=dev
DOC_ROOT=docs-root-xyz
SCOPE=.
GIT_CONVENTION=(없음) — 코어 규칙이 SSOT
SPEC_DIR=docs-root-xyz/specs
CURRENT_BEHAVIOR=docs-root-xyz/current.md
PRIORITY_SSOT=docs-root-xyz/priority.md
ARCH_OVERVIEW=docs-root-xyz/arch.md
SCHEMA_SSOT=(없음) — DB 없음
API_RESPONSE=docs-root-xyz/api-response.md
API_DOCS=(없음) — 생성 문서 없음
PRODUCT_SCOPE=docs-root-xyz/scope.md
CLIENT_ASSUMPTIONS=docs-root-xyz/client.md
GLOSSARY=docs-root-xyz/glossary.md
DECISIONS_DIR=docs-root-xyz/decisions
AUDIT_DIR=docs-root-xyz/audits
DEPLOY_SSOT=(없음) — 배포 없음
TEST_CMD=make verify-all
BUILD_CMD=make build
FORMAT_CMD=make fmt
DEPS_CMD=make deps
BRANCH_FORMAT={type}/{issue-number}-{description}
COMMIT_FORMAT={Type}: {summary}
BASE_BRANCH=main
MERGE_METHOD=squash
ISSUE_LINK=Closes #{issue-number}
FLAG_GENERATED_DOCS=0
HARNESS_SELF_EDIT=0
POLISH_ENABLED=1
BLOCK_FORCE_PUSH=1
BLOCK_BULK_DELETE=1
BLOCK_GIT_DISCARD=1
BLOCK_CHECK_BYPASS=1
BLOCK_DATA_DELETE=1
BLOCK_SYSTEM=1
AUTO_ANALYZE=0
